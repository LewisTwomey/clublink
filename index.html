<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ClubLink</title>
<meta name="description" content="The Salmon Leap's football quiz. Name a player who played for all three clubs.">
<meta name="theme-color" content="#0b0907">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b0907;--wood:#1c140e;--wood2:#261b13;--line:rgba(244,234,216,.12);--line2:rgba(244,234,216,.22);
  --cream:#f4ead8;--mute:#b3a58f;--dim:#7f735f;--brass:#e2b45a;--brass2:#b8862f;
  --good:#5cc98a;--goodbg:rgba(92,201,138,.16);--bad:#ef6b55;--r:16px;
  --serif:'DM Serif Display',Georgia,serif;--sans:Inter,system-ui,sans-serif
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--night);color:var(--cream);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:url(pub.jpg) center 30%/cover no-repeat;opacity:.32;filter:blur(5px) saturate(1.1);transform:scale(1.08);z-index:-2}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(120% 70% at 50% 0%,rgba(226,180,90,.10),transparent 60%),linear-gradient(180deg,rgba(11,9,7,.55),rgba(11,9,7,.92) 55%,var(--night));z-index:-1}
body.home::before{opacity:0}
main{max-width:460px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}

/* hero */
.hero{margin:-16px -16px 0;height:min(46vh,340px);background:url(pub.jpg) center 42%/cover no-repeat;position:relative;display:flex;align-items:flex-end;padding:0 20px 18px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,9,7,0) 35%,rgba(11,9,7,.75) 78%,var(--night))}
.hero>div{position:relative;z-index:1}
.kicker{font-size:11px;font-weight:600;letter-spacing:2.4px;text-transform:uppercase;color:var(--brass)}
h1{font-family:var(--serif);font-weight:400;font-size:52px;line-height:1;letter-spacing:.5px;margin-top:6px;color:var(--cream);text-shadow:0 2px 18px rgba(0,0,0,.6)}
h2{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.1}
.lede{color:var(--mute);font-size:15px;line-height:1.55;margin:14px 0 2px}

/* bar rail of taps */
.rail{display:flex;justify-content:center;gap:18px;padding:14px 0 0;border-bottom:6px solid var(--brass2);box-shadow:0 1px 0 rgba(255,255,255,.08);margin:6px 0 4px;position:relative}
.rail::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:4px;background:var(--wood2)}
.rail svg{width:26px;height:58px}

.panel{background:linear-gradient(180deg,rgba(38,27,19,.86),rgba(28,20,14,.9));border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(6px)}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.6px;color:var(--mute);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.label::after{content:"";flex:1;height:1px;background:var(--line)}
.panel .label:first-child{margin-top:2px}

input[type=text]{width:100%;height:50px;border-radius:12px;border:1px solid var(--line2);background:rgba(11,9,7,.6);color:var(--cream);font:500 17px var(--sans);padding:0 14px;outline:none}
input[type=text]::placeholder{color:var(--dim)}
input[type=text]:focus{border-color:var(--brass);box-shadow:0 0 0 3px rgba(226,180,90,.15)}
button{font:600 15px var(--sans);border:0;cursor:pointer;color:var(--cream);background:transparent}
.btn{width:100%;height:54px;border-radius:14px;background:var(--brass);color:#24180a;font-size:17px;font-weight:700;margin-top:14px;box-shadow:inset 0 -3px 0 var(--brass2)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 -1px 0 var(--brass2)}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line2);box-shadow:none;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(11,9,7,.5);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{height:40px;border-radius:9px;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--cream);color:var(--night)}
.hint{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.5}
.prow{display:flex;gap:8px;margin-bottom:8px}
.prow button{width:50px;flex:none;border:1px solid var(--line2);border-radius:12px;color:var(--mute);font-size:20px}
.add{height:44px;width:100%;border:1px dashed var(--line2);border-radius:12px;color:var(--mute)}

/* game */
.topbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);padding:4px 2px 12px}
.topbar b{color:var(--brass);font-weight:600}
.clubs{display:grid;gap:8px}
.club{display:flex;align-items:center;gap:12px;background:var(--cream);color:#1d150d;border-radius:14px;padding:10px 14px 10px 10px;min-height:62px;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:opacity .2s,background .2s}
.crest{width:42px;height:42px;flex:none;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.crest img{width:30px;height:30px;object-fit:contain}
.cn{flex:1;font-weight:700;font-size:19px;letter-spacing:-.2px;line-height:1.15}
.club small{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:#8a7b66}
.club.hit{background:#dff3e6;box-shadow:0 0 0 2px var(--good),0 6px 18px rgba(0,0,0,.35)}
.club.miss{opacity:.32}
.ord{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#1d150d;color:var(--brass);font-size:12px;font-weight:700;margin-right:8px;vertical-align:2px}
.turn{text-align:center;margin:22px 0 4px}
.turn .pre{font-size:13px;color:var(--mute)}
.who{font-family:var(--serif);font-size:40px;line-height:1.1;color:var(--brass)}
.clock{display:flex;align-items:center;gap:12px;margin:14px 0}
.clock .bar{flex:1;height:6px;background:rgba(244,234,216,.1);border-radius:3px;overflow:hidden}
.clock .bar i{display:block;height:100%;background:var(--brass);transition:width .25s linear}
.clock.low .bar i{background:var(--bad)}
.secs{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;width:34px;text-align:right}
.clock.low .secs{color:var(--bad)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.sugg{display:grid;gap:4px;margin-top:6px}
.sugg button,.sugg .picked{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(28,20,14,.85)}
.sugg button:active{background:rgba(226,180,90,.12)}
.sugg .picked{border-color:var(--brass);background:rgba(226,180,90,.1)}
.sugg b{font-weight:600;font-size:16px}
.sugg span{font-size:13px;color:var(--mute)}
.sugg .none{color:var(--mute);font-size:14px;padding:6px 2px}

/* clue taps */
.taps{margin-top:18px}
.taphead{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--mute)}
.taphead b{font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--mute)}
.tapline{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;padding-bottom:10px;border-bottom:6px solid var(--brass2);position:relative}
.tapline::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:4px;background:var(--wood2)}
.tap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
.tap svg{width:34px;height:74px;transform-origin:50% 88%;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.tap span{font-size:12px;font-weight:600;color:var(--cream);line-height:1.2;text-align:center}
.tap em{font-style:normal;font-size:11px;color:var(--brass)}
.tap.poured svg{transform:rotate(-24deg)}
.tap.poured em{color:var(--bad)}
.tap:disabled{opacity:.35}
.cluebox{margin-top:18px;display:grid;gap:6px}
.cluebox div{background:rgba(226,180,90,.1);border:1px solid rgba(226,180,90,.35);border-radius:12px;padding:10px 14px;font-size:15px}
.cluebox b{color:var(--brass)}

.result{text-align:center;padding:18px 0 6px}
.pts{font-family:var(--serif);font-size:92px;line-height:1;color:var(--brass)}
.pts.zero{color:var(--bad)}
.calc{color:var(--mute);font-size:14px;margin-top:4px}
.matched{font-size:18px;margin-top:6px}
.override{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.override button{height:42px;border:1px solid var(--line2);border-radius:10px;font-size:15px}
.override button.on{background:var(--cream);color:var(--night)}

.board{border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.board div{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(28,20,14,.85);font-size:17px}
.board div+div{border-top:1px solid var(--line)}
.board div b{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700}
.board div.lead{background:rgba(226,180,90,.14)}
.board div.lead b,.board div.lead span{color:var(--brass)}
.ans{font-size:15px;line-height:1.75}
.ans b{font-weight:600}
.dim{color:var(--mute);font-size:13px}
.log{font-size:14px;color:var(--mute);line-height:1.8}
.hidden{display:none!important}
.center{text-align:center}
.foot{font-size:12px;color:var(--dim);text-align:center;margin-top:22px;line-height:1.6}
</style>
</head>
<body class="home">
<main id="app"><p class="lede">Pulling the first pint…</p></main>
<script>
const $=s=>document.querySelector(s);
const app=$('#app');
const LEAGUE={GB1:'ENG',ES1:'ESP',IT1:'ITA',L1:'GER',FR1:'FRA',NL1:'NED',PO1:'POR'};
let D,IDX,S;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ø/g,'o').replace(/ß/g,'ss').replace(/ł/g,'l').toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;

/* a generic beer tap: handle + ferrule + font body */
const TAPCOL=['#b2453a','#2f6b4f','#3d5b8f','#c58b2c','#6e4a8f'];
function tapSVG(col,label){
  return `<svg viewBox="0 0 34 74" aria-hidden="true">
    <rect x="9" y="1" width="16" height="40" rx="7" fill="${col}"/>
    <rect x="9" y="13" width="16" height="12" fill="#f4ead8" opacity=".92"/>
    <text x="17" y="22" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="7" fill="#1d150d">${label||''}</text>
    <rect x="13" y="41" width="8" height="6" rx="1.5" fill="#e2b45a"/>
    <rect x="7" y="47" width="20" height="14" rx="4" fill="#c9cdd2"/>
    <rect x="7" y="47" width="20" height="4" rx="2" fill="#eef0f2"/>
    <path d="M14 61h6v7a3 3 0 0 1-6 0z" fill="#aeb3b9"/>
  </svg>`;
}
const rail=()=>`<div class="rail">${TAPCOL.map(c=>tapSVG(c)).join('')}</div>`;

function save(){try{localStorage.setItem('tc_setup',JSON.stringify({names:S.names,rounds:S.rounds,diff:S.diff,modern:S.modern}))}catch(e){}}
function loadSetup(){try{return JSON.parse(localStorage.getItem('tc_setup'))}catch(e){return null}}

async function init(){
  D=await (await fetch('data.json')).json();
  IDX=D.players.map(p=>{const n=norm(p[0]);return{n,t:n.split(' ')}});
  const s=loadSetup()||{};
  S={names:s.names&&s.names.length?s.names:['',''],rounds:s.rounds||5,diff:s.diff||'mixed',modern:s.modern!==false};
  setup();
}
const screen=(home)=>{document.body.classList.toggle('home',!!home);window.scrollTo(0,0)};

function setup(){
  screen(true);
  app.innerHTML=`<div class="hero"><div><div class="kicker">The Salmon Leap · Totton</div><h1>ClubLink</h1></div></div>
  ${rail()}
  <p class="lede">Three clubs come up. Name a player who played for all three. Three points for all three, two for two, one for one. Thirty seconds a go, no repeats in a round.</p>
  <div class="label">Who's playing</div>
  <div id="plist"></div>
  <button class="add" id="addp">+ Add player</button>
  <div class="label">Rounds</div>
  <div class="seg" id="rounds">${[3,5,10,15].map(n=>`<button data-v="${n}">${n}</button>`).join('')}</div>
  <div class="label">Difficulty</div>
  <div class="seg" id="diff">${['easy','medium','hard','mixed'].map(n=>`<button data-v="${n}">${n[0].toUpperCase()+n.slice(1)}</button>`).join('')}</div>
  <p class="hint">Easy and Medium use the top six clubs in each league. Hard uses every club.</p>
  <div class="label">Three-pointers</div>
  <div class="seg two" id="modern"><button data-v="true">2010 onwards</button><button data-v="false">All eras</button></div>
  <div class="err" id="serr"></div>
  <button class="btn" id="go">Kick off</button>
  <p class="foot">Clues cost a point each. Player data from Transfermarkt and Wikidata.</p>`;
  const draw=()=>{
    $('#plist').innerHTML=S.names.map((n,i)=>`<div class="prow"><input type="text" maxlength="16" placeholder="Player ${i+1}" value="${esc(n)}" data-i="${i}">${S.names.length>1?`<button data-x="${i}" aria-label="Remove player">×</button>`:''}</div>`).join('');
    $('#plist').querySelectorAll('input').forEach(el=>el.oninput=()=>{S.names[el.dataset.i]=el.value;$('#serr').textContent=''});
    $('#plist').querySelectorAll('[data-x]').forEach(el=>el.onclick=()=>{S.names.splice(+el.dataset.x,1);draw()});
    $('#addp').classList.toggle('hidden',S.names.length>=8);
  };
  const seg=(id,key)=>{const el=$('#'+id);const upd=()=>el.querySelectorAll('button').forEach(b=>b.classList.toggle('on',String(S[key])===b.dataset.v));
    el.querySelectorAll('button').forEach(b=>b.onclick=()=>{S[key]=key==='rounds'?+b.dataset.v:key==='modern'?b.dataset.v==='true':b.dataset.v;upd()});upd()};
  draw();seg('rounds','rounds');seg('diff','diff');seg('modern','modern');
  $('#addp').onclick=()=>{S.names.push('');draw();const all=$('#plist').querySelectorAll('input');all[all.length-1].focus()};
  $('#go').onclick=()=>{
    const names=S.names.map(n=>n.trim()).filter(Boolean);
    if(!names.length){$('#serr').textContent='Add at least one player';return}
    if(new Set(names.map(n=>n.toLowerCase())).size!==names.length){$('#serr').textContent='Player names need to be different';return}
    S.names=names;save();
    S.scores=names.map(()=>0);S.round=0;S.used=new Set();
    nextRound();
  };
}

function pickTrio(){
  const tier=S.diff==='easy'?0:S.diff==='medium'?1:S.diff==='hard'?2:(()=>{const r=Math.random();return r<.45?0:r<.85?1:2})();
  const ti=S.modern?6:3;const pool=D.trios.filter(t=>t[ti]===tier);
  for(let k=0;k<50;k++){const t=pool[Math.floor(Math.random()*pool.length)];const key=t.slice(0,3).join();if(!S.used.has(key)){S.used.add(key);return t}}
  return pool[Math.floor(Math.random()*pool.length)];
}

function nextRound(){
  S.round++;
  if(S.round>S.rounds){return finish()}
  S.trio=pickTrio();
  const n=S.names.length,start=(S.round-1)%n;
  S.order=[...Array(n)].map((_,i)=>(start+i)%n);
  S.turn=0;S.answers=[];
  turnIntro();
}

function clubsHTML(hits,order){
  const list=order||S.trio.slice(0,3);
  return `<div class="clubs" id="clubs">${list.map((ci,k)=>{const c=D.clubs[ci];const cls=hits?(hits.includes(ci)?' hit':' miss'):'';
    return `<div class="club${cls}"><div class="crest"><img src="https://tmssl.akamaized.net/images/wappen/head/${c[2]}.png" alt="" loading="lazy" onerror="this.style.visibility='hidden'"></div><span class="cn">${order?`<span class="ord">${k+1}</span>`:''}${esc(c[0])}</span><small>${LEAGUE[c[1]]}</small></div>`}).join('')}</div>`;
}
function topbar(){return `<div class="topbar"><span>Round <b>${S.round}</b> of ${S.rounds}</span><span>${S.diff}${S.modern?' · 2010+':''}</span></div>`}
const threes=()=>S.modern?[S.trio[7],S.trio[8]]:[S.trio[4],S.trio[5]];
const clueOf=()=>S.trio[S.modern?10:9];

function turnIntro(){
  screen(false);
  const p=S.order[S.turn];
  if(S.names.length===1){return startTurn()}
  const taken=S.answers.filter(a=>a.player!=null).map(a=>esc(D.players[a.player][0]));
  app.innerHTML=`${topbar()}${clubsHTML()}
  <div class="turn"><div class="pre">Pass the phone to</div><div class="who">${esc(S.names[p])}</div></div>
  <button class="btn" id="start">I'm ready</button>
  ${taken.length?`<div class="label">Already said</div><div class="log">${taken.join(', ')}</div>`:''}`;
  $('#start').onclick=startTurn;
}

let tick;
function startTurn(){
  screen(false);
  const p=S.order[S.turn];
  const end=Date.now()+30000;
  let sel=null;
  const used=new Set();
  const co=clueOf(),pi=co?co[0]:threes()[0][0],cp=D.players[pi];
  const nat=cp[3],pos=cp[4],ini=cp[0].split(/\s+/).map(w=>w[0]).join('.')+'.';
  const CLUES=[
    {k:'order',name:'Club order',ok:!!co,show:()=>'Clubs re-ordered: <b>the order they joined them</b>'},
    {k:'nat',name:'Nationality',ok:!!nat,show:()=>`Nationality: <b>${esc(nat)}</b>`},
    {k:'pos',name:'Position & initials',ok:true,show:()=>`${pos?`Position: <b>${esc(pos)}</b> · `:''}Initials: <b>${esc(ini)}</b>`},
  ];
  app.innerHTML=`${topbar()}<div id="clubwrap">${clubsHTML()}</div>
  <div class="turn"><div class="who">${esc(S.names[p])}</div></div>
  <div class="clock" id="clock"><div class="bar"><i id="barfill" style="width:100%"></i></div><div class="secs" id="secs">30</div></div>
  <input type="text" id="guess" placeholder="Start typing a player" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
  <div class="sugg" id="sugg"></div>
  <div class="err" id="gerr"></div>
  <button class="btn" id="sub">Lock it in</button>
  <button class="btn ghost" id="pass">Pass</button>
  <div class="taps"><div class="taphead"><b>Clues on tap</b><span>1 point a pint</span></div>
    <div class="tapline">${CLUES.map((c,i)=>`<button class="tap" data-k="${c.k}" ${c.ok?'':'disabled'} aria-label="${c.name} clue, costs 1 point">${tapSVG(TAPCOL[i],'')}<span>${c.name}</span><em>${c.ok?'−1 pt':'No data'}</em></button>`).join('')}</div>
  </div>
  <div class="cluebox" id="cluebox"></div>`;
  const g=$('#guess'),sg=$('#sugg');g.focus();
  const card=i=>`<b>${esc(D.players[i][0])}</b><span>${esc(D.players[i][2]||'Former player')}</span>`;
  const draw=()=>{
    const q=norm(g.value);sel=null;$('#gerr').textContent='';
    if(q.length<2){sg.innerHTML='';return}
    const res=search(q);
    sg.innerHTML=res.length?res.map(i=>`<button data-i="${i}">${card(i)}</button>`).join(''):`<div class="none">No player found</div>`;
    sg.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;g.value=D.players[sel][0];sg.innerHTML=`<div class="picked">${card(sel)}</div>`});
  };
  g.oninput=draw;
  g.onkeydown=e=>{if(e.key==='Enter'){if(sel==null){const f=sg.querySelector('[data-i]');if(f)f.click()}else submit()}};
  const update=()=>{const left=Math.max(0,end-Date.now());const s=Math.ceil(left/1000);$('#secs').textContent=s;$('#barfill').style.width=(left/300)+'%';$('#clock').classList.toggle('low',s<=10);if(left<=0){clearInterval(tick);resolve(null,'Time’s up',null,used.size)}};
  clearInterval(tick);tick=setInterval(update,250);
  $('#pass').onclick=()=>{clearInterval(tick);resolve(null,'Passed',null,used.size)};
  app.querySelectorAll('.tap').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;if(used.has(k))return;
    used.add(k);b.classList.add('poured');
    if(k==='order')$('#clubwrap').innerHTML=clubsHTML(null,co[1]);
    $('#cluebox').innerHTML=CLUES.filter(c=>used.has(c.k)).map(c=>`<div>${c.show()}</div>`).join('');
  });
  $('#sub').onclick=submit;
  function submit(){
    if(sel==null){$('#gerr').textContent=norm(g.value).length<2?'Start typing a player first':'Pick a player from the list';return}
    if(S.answers.some(a=>a.player===sel)){$('#gerr').textContent=`${D.players[sel][0]} has already been said this round`;return}
    clearInterval(tick);
    const s=D.players[sel][1].filter(c=>S.trio.slice(0,3).includes(c)).length;
    resolve(D.players[sel][0],null,{i:sel,s},used.size);
  }
}

function search(q){
  const qt=q.split(' '),out=[];
  for(let i=0;i<IDX.length&&out.length<8;i++){
    const t=IDX[i].t;
    if(qt.every(w=>t.some(x=>x.startsWith(w))))out.push(i);
  }
  return out;
}

function resolve(raw,reason,m,clues){
  const p=S.order[S.turn];
  let base=0,hits=[],player=null;
  if(m){player=m.i;base=m.s;hits=D.players[m.i][1].filter(c=>S.trio.slice(0,3).includes(c))}
  const ans={who:p,raw,player,base,clues,pts:base-clues,reason};
  S.answers.push(ans);S.scores[p]+=ans.pts;
  const showResult=()=>{
    app.innerHTML=`${topbar()}${clubsHTML(raw?hits:[])}
    <div class="result">
      <div class="pts ${ans.pts>0?'':'zero'}">${ans.pts}</div>
      ${clues?`<div class="calc">${plural(ans.base,'point')} − ${plural(clues,'clue')}</div>`:''}
      <div class="matched">${reason?esc(reason):esc(D.players[player][0])}</div>
      <div class="dim">${esc(S.names[p])}</div>
    </div>
    ${raw?`<div class="label">Data missed a spell? Set the clubs matched</div><div class="override">${[0,1,2,3].map(n=>`<button data-p="${n}" class="${n===ans.base?'on':''}">${n}</button>`).join('')}</div>`:''}
    <button class="btn" id="next">${S.turn+1<S.order.length?`Next: ${esc(S.names[S.order[S.turn+1]])}`:'See the round'}</button>`;
    app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const n=+b.dataset.p;const np=n-ans.clues;S.scores[p]+=np-ans.pts;ans.base=n;ans.pts=np;showResult()});
    $('#next').onclick=()=>{S.turn++;S.turn<S.order.length?turnIntro():roundEnd()};
  };
  showResult();
}

function standings(){
  const rows=S.names.map((n,i)=>({n,s:S.scores[i]})).sort((a,b)=>b.s-a.s);
  return `<div class="board">${rows.map((r,k)=>`<div class="${k===0&&r.s>0?'lead':''}"><span>${esc(r.n)}</span><b>${r.s}</b></div>`).join('')}</div>`;
}

function roundEnd(){
  const t=S.trio,tr=t.slice(0,3),[three,total]=threes();
  const two=[];
  for(let i=0;i<D.players.length&&two.length<12;i++){const c=D.players[i][1];if(S.modern&&!D.players[i][5])continue;let n=0;for(const x of tr)if(c.includes(x))n++;if(n===2)two.push(i)}
  const pairs=i=>tr.filter(c=>D.players[i][1].includes(c)).map(c=>D.clubs[c][0]).join(' + ');
  app.innerHTML=`${topbar()}${clubsHTML()}
  <div class="label">This round</div>
  <div class="panel ans">${S.answers.map(a=>`<div><b>${esc(S.names[a.who])}</b> · ${a.player!=null?esc(D.players[a.player][0]):esc(a.reason)} · ${plural(a.pts,'pt')}${a.clues?` <span class="dim">(${plural(a.clues,'clue')})</span>`:''}</div>`).join('')}</div>
  <div class="label">Three points${S.modern?' · 2010+':''}</div>
  <div class="panel ans">${three.map(i=>esc(D.players[i][0])).join(', ')}${total>three.length?` <span class="dim">and ${total-three.length} more</span>`:''}</div>
  <div class="label">Two points</div>
  <div class="panel ans">${two.map(i=>`<div>${esc(D.players[i][0])} <span class="dim">· ${esc(pairs(i))}</span></div>`).join('')||'None'}</div>
  <div class="label">Table</div>${standings()}
  <button class="btn" id="next">${S.round<S.rounds?'Next round':'Final whistle'}</button>`;
  $('#next').onclick=nextRound;
}

function finish(){
  screen(false);
  const max=Math.max(...S.scores),winners=S.names.filter((_,i)=>S.scores[i]===max);
  app.innerHTML=`<div class="center" style="padding-top:28px"><div class="kicker">Full time</div><h2 style="margin-top:8px">${winners.length>1?'It’s a draw':esc(winners[0])+' wins'}</h2><p class="lede">${winners.length>1?'Next round’s on everyone.':'Next round’s on the losers.'}</p></div>
  ${rail()}
  <div class="label">Final table</div>${standings()}
  <button class="btn" id="again">Rematch</button>
  <button class="btn ghost" id="new">New game</button>`;
  $('#again').onclick=()=>{S.scores=S.names.map(()=>0);S.round=0;nextRound()};
  $('#new').onclick=setup;
}

init().catch(()=>{app.innerHTML='<p class="lede">Couldn’t load the player data. Refresh to try again.</p>'});
</script>
</body>
</html>
