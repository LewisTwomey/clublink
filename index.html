<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ClubLink</title>
<meta name="description" content="The Salmon Leap's football quiz. Name a player who played for all three clubs.">
<meta name="theme-color" content="#1B4332">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pitch:#1B4332;--pitch2:#163828;--pitch3:#22523D;--chalk:#1E201E;--ink:#1E201E;
  --paper:#F4F1EA;--paper2:#E9E3D5;--rule:#D9D1BF;--red:#D62828;--red2:#A61E1E;--white:#FFFFFF;
  --lime:#2E9E5B;--lime2:#1F7442;--mute:#B9CDBF;--dim:#86A592;--muteInk:#6B6458;
  --r:6px;--shadow:3px 4px 0 rgba(0,0,0,.28);
  --disp:'Oswald',Impact,'Arial Narrow',sans-serif;--sans:'Plus Jakarta Sans',system-ui,sans-serif;--hand:'Caveat','Comic Sans MS',cursive
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--pitch);color:var(--white);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;overflow-x:hidden;
  background:
   radial-gradient(130% 70% at 50% 0%,rgba(255,255,255,.07),transparent 60%),
   radial-gradient(120% 80% at 50% 120%,rgba(0,0,0,.35),transparent 60%),
   repeating-linear-gradient(180deg,var(--pitch) 0 64px,var(--pitch3) 64px 128px);
  background-attachment:fixed}
main{max-width:460px;margin:0 auto;padding:16px 16px 0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
main>*{flex-shrink:0}
button{font-family:var(--sans);border:0;cursor:pointer;color:inherit;background:none}
.hidden{display:none!important}
.center{text-align:center}

/* masthead + framed photos */
.masthead{background:var(--red);color:var(--white);border:2px solid var(--ink);box-shadow:var(--shadow);padding:10px 14px 12px;transform:rotate(-1deg);margin:4px 2px 0;position:relative}
.masthead::after{content:"";position:absolute;left:10px;right:10px;bottom:6px;height:2px;background:rgba(255,255,255,.35)}
.kicker{font-family:var(--disp);font-weight:500;font-size:12px;letter-spacing:2.6px;text-transform:uppercase;opacity:.9}
h1{font-family:var(--disp);font-weight:700;font-size:58px;line-height:.95;text-transform:uppercase;letter-spacing:1px}
h2{font-family:var(--disp);font-weight:700;font-size:40px;line-height:1;text-transform:uppercase;letter-spacing:.5px}
.wall{position:relative;height:250px;margin:18px 0 6px}
.polaroid{position:absolute;background:#fff;padding:8px 8px 34px;border:1px solid rgba(0,0,0,.15);box-shadow:4px 8px 18px rgba(0,0,0,.4)}
.polaroid img{display:block;width:100%;height:100%;object-fit:cover;background:#222}
.polaroid figcaption{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--hand);font-size:20px;color:#2a2a2a}
.polaroid::before{content:"";position:absolute;top:-9px;left:50%;width:70px;height:20px;margin-left:-35px;background:rgba(244,241,234,.75);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.p-pub{left:0;top:6px;width:72%;height:210px;transform:rotate(-2.5deg)}
.p-taps{right:0;top:58px;width:44%;height:180px;transform:rotate(3.5deg);z-index:1}
.p-taps::before{left:40%}
.polaroid.solo{position:relative;display:block;width:78%;height:170px;margin:18px auto 8px;transform:rotate(2deg)}
.lede{color:var(--paper);font-size:15px;line-height:1.55;margin:14px 0 4px}

/* section headers */
.label{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:1.8px;text-transform:uppercase;color:var(--white);margin:24px 0 10px;display:flex;align-items:center;gap:10px}
.label::before{content:"";width:14px;height:14px;background:var(--red);border:2px solid var(--ink);transform:rotate(45deg);flex:none}
.label::after{content:"";flex:1;height:2px;background:rgba(255,255,255,.18)}
.hint,.foot{font-size:12.5px;color:var(--mute);margin-top:8px;line-height:1.5}
.foot{text-align:center;margin:22px 0 8px}

/* quiz-sheet inputs */
input[type=text]{width:100%;height:50px;border:0;border-bottom:2px dashed rgba(244,241,234,.65);background:transparent;color:var(--white);font:700 26px var(--hand);padding:0 4px;outline:none;border-radius:0}
input[type=text]::placeholder{color:rgba(244,241,234,.45)}
input[type=text]:focus{border-bottom:2px solid var(--white)}
.prow{display:flex;gap:10px;margin-bottom:6px;align-items:flex-end}
.prow .num{font-family:var(--disp);font-weight:700;font-size:18px;color:var(--red);background:var(--paper);border:2px solid var(--ink);width:30px;height:30px;display:grid;place-items:center;flex:none;margin-bottom:8px;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.prow button{width:36px;height:36px;flex:none;color:var(--mute);font-size:22px;margin-bottom:6px}
.add{height:40px;width:100%;margin-top:6px;border:2px dashed rgba(244,241,234,.4);color:var(--paper);font-family:var(--disp);font-weight:600;letter-spacing:1px;text-transform:uppercase;font-size:14px}

/* chunky buttons */
.btn{display:block;width:100%;height:58px;background:var(--red);color:var(--white);font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:1.5px;text-transform:uppercase;border:2px solid var(--ink);border-bottom-width:6px;border-radius:var(--r);margin-top:14px;transition:transform .06s,border-bottom-width .06s}
.btn:active{transform:translateY(4px);border-bottom-width:2px}
.btn.ghost{background:var(--paper);color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{height:46px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-bottom-width:4px;border-radius:var(--r);font-family:var(--disp);font-weight:600;font-size:16px;letter-spacing:.8px;text-transform:uppercase;transition:transform .06s}
.seg button:active{transform:translateY(2px);border-bottom-width:2px}
.seg button.on{background:var(--lime);color:var(--white);transform:translateY(2px);border-bottom-width:2px}
.err{color:#FFB3B3;font-size:14px;font-weight:600;min-height:20px;margin-top:6px}

/* programme strip */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:2px 0 12px}
.topbar span{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:1.4px;text-transform:uppercase}
.topbar span:first-child b{font-size:20px}
.topbar span:last-child{background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:2px 8px;font-size:12px;transform:rotate(1.5deg)}

/* club trading cards */
.clubs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.club{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;min-height:118px;transition:opacity .2s,transform .2s,background .2s}
.club:nth-child(1){transform:rotate(-1.2deg)}.club:nth-child(2){transform:rotate(.8deg)}.club:nth-child(3){transform:rotate(-.6deg)}
.club small{order:-1;align-self:stretch;background:var(--ink);color:var(--paper);font-family:var(--disp);font-weight:600;font-size:10.5px;letter-spacing:2px;padding:3px 0}
.crest{width:46px;height:46px;flex:none;margin:9px 0 6px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center}
.crest img{width:32px;height:32px;object-fit:contain}
.cn{font-family:var(--disp);font-weight:700;font-size:16px;line-height:1.05;text-transform:uppercase;letter-spacing:.3px;padding:0 5px 9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.club.hit{background:#D8F0DF;box-shadow:0 0 0 3px var(--lime),var(--shadow)}
.club.hit small{background:var(--lime2)}
.club.miss{opacity:.38;filter:grayscale(.7)}
.ord{position:absolute;top:22px;left:5px;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;border:2px solid var(--ink);font-family:var(--disp);font-size:13px;font-weight:700;z-index:1}

/* turn */
.turn{text-align:center;margin:30px 0 10px}
.turn .pre{font-family:var(--hand);font-size:24px;color:var(--paper)}
.who{font-family:var(--disp);font-weight:700;font-size:46px;line-height:1.05;text-transform:uppercase;color:var(--white)}
.turn .who{display:inline-block;border-bottom:5px solid var(--red);padding:0 6px 2px}
.log{font-size:14px;color:var(--paper);line-height:1.8}
.play{position:fixed;left:0;right:0;top:0;height:100vh;margin:0 auto;max-width:460px;display:flex;flex-direction:column;padding:12px 16px 8px;overflow:hidden;z-index:1}
body.playing{overflow:hidden;position:fixed;inset:0;width:100%}
.turnbar{display:flex;align-items:center;gap:10px;margin:16px 0 8px}
.turnbar .who{font-size:30px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secs{font-family:var(--disp);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;background:var(--chalk);color:#FFE45C;border:2px solid var(--paper);padding:0 8px;min-width:52px;text-align:center;letter-spacing:1px}
.turnbar.low .secs{color:#fff;background:var(--red);animation:pulse .5s ease-in-out infinite alternate}
.passbtn{height:38px;padding:0 12px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-bottom-width:4px;border-radius:var(--r);font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:1px;text-transform:uppercase}
.passbtn:active{transform:translateY(2px);border-bottom-width:2px}
.thin{height:8px;background:rgba(0,0,0,.3);border:2px solid var(--ink);margin-bottom:12px}
.thin i{display:block;height:100%;background:var(--paper);transition:width .25s linear}
.thin.low i{background:var(--red)}
@keyframes pulse{to{transform:scale(1.08)}}

/* pint polaroid clues */
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}
.chip{position:relative;display:flex;flex-direction:column;background:#fff;color:var(--ink);padding:4px 4px 0;border:1px solid rgba(0,0,0,.2);box-shadow:2px 4px 10px rgba(0,0,0,.35);transition:transform .15s}
.chip:nth-child(1){transform:rotate(-2deg)}.chip:nth-child(2){transform:rotate(1.5deg)}.chip:nth-child(3){transform:rotate(-1deg)}.chip:nth-child(4){transform:rotate(2deg)}
.chip:active{transform:scale(.95)}
.chip .pint{height:62px;background-size:cover;background-position:center}
.chip .cost{position:absolute;top:-8px;right:-7px;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;border:2px solid var(--ink);font-family:var(--disp);font-size:13px;font-weight:700;transform:rotate(12deg)}
.chip span{display:flex;align-items:center;justify-content:center;min-height:34px;padding:2px;font-family:var(--hand);font-weight:700;font-size:17px;line-height:1;text-align:center;overflow-wrap:anywhere;hyphens:auto}
.chip.poured{background:#FFF6C9}
.chip.poured span{color:var(--red);font-size:15px;overflow-wrap:normal;word-break:normal}
.chip.poured .pint{filter:brightness(.75)}
.chip.poured .cost{background:var(--ink)}
.chip:disabled{opacity:.45;filter:grayscale(1)}

/* guess + suggestions */
.play .sugg{flex:1;min-height:0;overflow-y:auto;align-content:start;-webkit-overflow-scrolling:touch;padding:2px 2px 8px}
.sugg{display:grid;gap:6px;margin-top:8px}
.sugg button,.sugg .picked{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:8px 12px;min-height:46px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-bottom-width:4px;border-radius:var(--r)}
.sugg button:active{transform:translateY(2px);border-bottom-width:2px;background:#fff}
.sugg b{font-weight:700;font-size:15px}
.sugg span{font-size:12px;color:var(--muteInk);text-align:right;flex:none;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg .none{color:var(--paper);font-family:var(--hand);font-size:22px;padding:4px 2px}
.play .foot2{flex:none;font-size:12px;color:var(--mute);padding-top:4px}

/* keyboard open: compact */
.kb .play .club{min-height:0;flex-direction:row;justify-content:flex-start;text-align:left;gap:6px;padding:5px 6px;transform:none}
.kb .play .club small{display:none}
.kb .play .crest{width:28px;height:28px;margin:0;border-width:1.5px}
.kb .play .crest img{width:20px;height:20px}
.kb .play .cn{font-size:13px;padding:0;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kb .play .ord{top:-8px;left:-6px;width:20px;height:20px;font-size:11px}
.kb .play .turnbar{margin:8px 0 5px}
.kb .play .turnbar .who{font-size:22px}
.kb .play .secs{font-size:18px}
.kb .play .passbtn{height:32px}
.kb .play .thin{height:6px;margin-bottom:7px}
.kb .play .chips{margin-bottom:4px}
.kb .play .chip .pint{height:28px}
.kb .play .chip span{min-height:24px;font-size:14px}
.kb .play .foot2{display:none}
.kb .play input[type=text]{height:42px;font-size:24px}

/* result + stamps */
.result{position:relative;text-align:center;padding:22px 0 6px;min-height:200px}
.pts{font-family:var(--disp);font-weight:700;font-size:96px;line-height:1;color:var(--white);text-shadow:4px 4px 0 rgba(0,0,0,.3)}
.calc{color:var(--paper);font-size:14px;margin-top:4px}
.matched{font-family:var(--hand);font-size:30px;font-weight:700;margin-top:4px;color:var(--paper)}
.dim{color:var(--mute);font-size:13px}
.stamp{position:relative;display:inline-block;margin:2px 0 10px;font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:2px;padding:4px 14px;border:5px solid currentColor;border-radius:8px;background:rgba(244,241,234,.92);pointer-events:none;animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both;z-index:2;box-shadow:3px 3px 0 rgba(0,0,0,.25)}
.stamp.goal{color:var(--lime2);font-size:44px;--rot:-12deg}
.stamp.post{color:#C47A00;font-size:34px;--rot:8deg}
.stamp.miss{color:var(--red);font-size:36px;--rot:-6deg}
@keyframes stamp{0%{opacity:0;transform:rotate(var(--rot)) scale(2.4)}60%{opacity:1}100%{opacity:1;transform:rotate(var(--rot)) scale(1)}}
.redcard{position:absolute;top:18px;right:18%;width:52px;height:72px;background:var(--red);border:2px solid var(--ink);border-radius:5px;box-shadow:3px 4px 0 rgba(0,0,0,.3);animation:card .5s ease-out both;z-index:1}
@keyframes card{0%{transform:translateY(-40px) rotate(-30deg);opacity:0}60%{transform:translateY(4px) rotate(14deg);opacity:1}100%{transform:rotate(10deg)}}
.shake{animation:shake .45s ease-in-out .25s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.pop{animation:pop .5s cubic-bezier(.2,1.8,.4,1) .15s both}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.override{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.override button{height:44px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-bottom-width:4px;border-radius:var(--r);font-family:var(--disp);font-weight:700;font-size:18px}
.override button.on{background:var(--ink);color:var(--paper)}

/* answer sheet + scoreboard */
.panel{position:relative;background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:var(--shadow);padding:10px 14px 10px 34px;background-image:linear-gradient(90deg,transparent 24px,rgba(214,40,40,.45) 24px,rgba(214,40,40,.45) 26px,transparent 26px),repeating-linear-gradient(180deg,transparent 0 25px,var(--rule) 25px 26px);background-position:0 4px}
.panel:nth-of-type(odd){transform:rotate(-.4deg)}
.ans{font-size:15px;line-height:26px}
.ans b{font-weight:700}
.panel .dim{color:var(--muteInk)}
.board{background:var(--chalk);border:3px solid var(--paper);box-shadow:var(--shadow);padding:6px}
.board div{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;font-family:var(--disp);font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:.8px}
.board div+div{border-top:1px dashed rgba(244,241,234,.25)}
.board div b{font-weight:700;font-size:26px;color:#FFE45C;font-variant-numeric:tabular-nums;background:#000;padding:0 10px;min-width:48px;text-align:center}
.board div.lead span::before{content:"★ ";color:#FFE45C}

/* docked actions */
.dock{position:sticky;bottom:0;z-index:2;margin:auto -16px 0;padding:16px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(27,67,50,0),var(--pitch2) 30%)}
.dock .btn{margin-top:0}
.dock.two{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
</style>
</head>
<body class="home">
<main id="app"><p class="lede" style="font-family:var(--hand);font-size:26px;text-align:center;margin-top:40vh">Pulling the first pint…</p></main>
<script>
const $=s=>document.querySelector(s);
const app=$('#app');
const LEAGUE={GB1:'ENG',ES1:'ESP',IT1:'ITA',L1:'GER',FR1:'FRA',NL1:'NED',PO1:'POR'};
let D,IDX,S;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ø/g,'o').replace(/ß/g,'ss').replace(/ł/g,'l').toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;

/* a generic beer tap: handle + ferrule + font body */
const TAPCOL=['#b2453a','#2f6b4f','#3d5b8f','#c58b2c','#6e4a8f'];
function tapSVG(col,label){
  return `<svg viewBox="0 0 34 74" aria-hidden="true">
    <rect x="9" y="1" width="16" height="40" rx="7" fill="${col}"/>
    <rect x="9" y="13" width="16" height="12" fill="#f4ead8" opacity=".92"/>
    <text x="17" y="22" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="7" fill="#1d150d">${label||''}</text>
    <rect x="13" y="41" width="8" height="6" rx="1.5" fill="#e2b45a"/>
    <rect x="7" y="47" width="20" height="14" rx="4" fill="#c9cdd2"/>
    <rect x="7" y="47" width="20" height="4" rx="2" fill="#eef0f2"/>
    <path d="M14 61h6v7a3 3 0 0 1-6 0z" fill="#aeb3b9"/>
  </svg>`;
}
const TAPS='https://burst.shopifycdn.com/photos/beer-taps.jpg?width=900&format=pjpg&exif=0&iptc=0';
const rail=()=>`<figure class="polaroid solo"><img src="${TAPS}" alt="A row of beer taps"><figcaption>Last orders</figcaption></figure>`;

function save(){try{localStorage.setItem('tc_setup',JSON.stringify({names:S.names,rounds:S.rounds,diff:S.diff,modern:S.modern}))}catch(e){}}
function loadSetup(){try{return JSON.parse(localStorage.getItem('tc_setup'))}catch(e){return null}}

async function init(){
  D=await (await fetch('data.json')).json();
  IDX=D.players.map(p=>{const n=norm(p[0]);return{n,t:n.split(' ')}});
  const s=loadSetup()||{};
  S={names:s.names&&s.names.length?s.names:['',''],rounds:s.rounds||5,diff:['fun','hard'].includes(s.diff)?s.diff:'fun',modern:s.modern!==false};
  setup();
}
const screen=(home)=>{document.body.classList.remove('playing','kb');document.body.classList.toggle('home',!!home);window.scrollTo(0,0)};
function fitPlay(){
  const el=document.getElementById('play');if(!el)return;
  const vv=window.visualViewport,h=vv?vv.height:window.innerHeight,top=vv?vv.offsetTop:0;
  el.style.height=h+'px';el.style.top=top+'px';
  fitPlay.full=Math.max(fitPlay.full||0,h,document.documentElement.clientHeight);
  document.body.classList.toggle('kb',h<fitPlay.full*0.78);
}
window.addEventListener('orientationchange',()=>{fitPlay.full=0;setTimeout(fitPlay,300)});
if(window.visualViewport){visualViewport.addEventListener('resize',fitPlay);visualViewport.addEventListener('scroll',fitPlay)}
window.addEventListener('resize',fitPlay);

function setup(){
  screen(true);
  app.innerHTML=`<header class="masthead"><div class="kicker">The Salmon Leap · Totton · Matchday quiz</div><h1>ClubLink</h1></header>
  <div class="wall">
    <figure class="polaroid p-pub"><img src="pub.jpg" alt="The Salmon Leap pub at night"><figcaption>The Salmon Leap</figcaption></figure>
    <figure class="polaroid p-taps"><img src="${TAPS}" alt="A row of beer taps"><figcaption>On tap</figcaption></figure>
  </div>
  <p class="lede">Three clubs come up. Name a player who played for all three. Three points for all three, two for two, one for one. Thirty seconds a go, no repeats in a round.</p>
  <div class="label">Who's playing</div>
  <div id="plist"></div>
  <button class="add" id="addp">+ Add player</button>
  <div class="label">Rounds</div>
  <div class="seg" id="rounds">${[3,5,10,15].map(n=>`<button data-v="${n}">${n}</button>`).join('')}</div>
  <div class="label">Difficulty</div>
  <div class="seg two" id="diff"><button data-v="fun">Fun pub mode</button><button data-v="hard">Hard mixed</button></div>
  <p class="hint">Fun pub mode sticks to the top six clubs in each league. Hard mixed throws in every club.</p>
  <div class="label">Three-pointers</div>
  <div class="seg two" id="modern"><button data-v="true">2010 onwards</button><button data-v="false">All eras</button></div>
  <p class="foot">Clues cost a point each, initials cost two. Beer and tap photos from Burst. Player data from Transfermarkt and Wikidata.</p>
  <div class="dock"><div class="err" id="serr" style="min-height:0;margin:0 0 6px"></div><button class="btn" id="go">Kick off</button></div>`;
  const draw=()=>{
    $('#plist').innerHTML=S.names.map((n,i)=>`<div class="prow"><span class="num">${i+1}</span><input type="text" maxlength="16" placeholder="Name" value="${esc(n)}" data-i="${i}">${S.names.length>1?`<button data-x="${i}" aria-label="Remove player">×</button>`:''}</div>`).join('');
    $('#plist').querySelectorAll('input').forEach(el=>el.oninput=()=>{S.names[el.dataset.i]=el.value;$('#serr').textContent=''});
    $('#plist').querySelectorAll('[data-x]').forEach(el=>el.onclick=()=>{S.names.splice(+el.dataset.x,1);draw()});
    $('#addp').classList.toggle('hidden',S.names.length>=8);
  };
  const seg=(id,key)=>{const el=$('#'+id);const upd=()=>el.querySelectorAll('button').forEach(b=>b.classList.toggle('on',String(S[key])===b.dataset.v));
    el.querySelectorAll('button').forEach(b=>b.onclick=()=>{S[key]=key==='rounds'?+b.dataset.v:key==='modern'?b.dataset.v==='true':b.dataset.v;upd()});upd()};
  draw();seg('rounds','rounds');seg('diff','diff');seg('modern','modern');
  $('#addp').onclick=()=>{S.names.push('');draw();const all=$('#plist').querySelectorAll('input');all[all.length-1].focus()};
  $('#go').onclick=()=>{
    const names=S.names.map(n=>n.trim()).filter(Boolean);
    if(!names.length){$('#serr').textContent='Add at least one player';return}
    if(new Set(names.map(n=>n.toLowerCase())).size!==names.length){$('#serr').textContent='Player names need to be different';return}
    S.names=names;save();
    S.scores=names.map(()=>0);S.round=0;S.used=new Set();
    nextRound();
  };
}

function pickTrio(){
  const r=Math.random(),tier=S.diff==='fun'?(r<.7?0:1):(r<.15?0:r<.5?1:2);
  const ti=S.modern?6:3;const pool=D.trios.filter(t=>t[ti]===tier);
  for(let k=0;k<50;k++){const t=pool[Math.floor(Math.random()*pool.length)];const key=t.slice(0,3).join();if(!S.used.has(key)){S.used.add(key);return t}}
  return pool[Math.floor(Math.random()*pool.length)];
}

function nextRound(){
  S.round++;
  if(S.round>S.rounds){return finish()}
  S.trio=pickTrio();
  const n=S.names.length,start=(S.round-1)%n;
  S.order=[...Array(n)].map((_,i)=>(start+i)%n);
  S.turn=0;S.answers=[];
  turnIntro();
}

function clubsHTML(hits,order){
  const list=order||S.trio.slice(0,3);
  return `<div class="clubs" id="clubs">${list.map((ci,k)=>{const c=D.clubs[ci];const cls=hits?(hits.includes(ci)?' hit':' miss'):'';
    return `<div class="club${cls}"><div class="crest"><img src="https://tmssl.akamaized.net/images/wappen/head/${c[2]}.png" alt="" loading="lazy" onerror="this.style.visibility='hidden'"></div>${order?`<span class="ord">${k+1}</span>`:''}<span class="cn">${esc(c[0])}</span><small>${LEAGUE[c[1]]}</small></div>`}).join('')}</div>`;
}
function topbar(){return `<div class="topbar"><span>Round <b>${S.round}</b> of ${S.rounds}</span><span>${S.diff==='fun'?'Fun pub':'Hard mixed'}${S.modern?' · 2010+':''}</span></div>`}
const threes=()=>S.modern?[S.trio[7],S.trio[8]]:[S.trio[4],S.trio[5]];
const clueOf=()=>S.trio[S.modern?10:9];

function turnIntro(){
  screen(false);
  const p=S.order[S.turn];
  if(S.names.length===1){return startTurn()}
  const taken=S.answers.filter(a=>a.player!=null).map(a=>esc(D.players[a.player][0]));
  app.innerHTML=`${topbar()}${clubsHTML()}
  <div class="turn"><div class="pre">Pass the phone to</div><div class="who">${esc(S.names[p])}</div></div>
  ${taken.length?`<div class="label">Already said</div><div class="log">${taken.join(', ')}</div>`:''}
  <div class="dock"><button class="btn" id="start">I'm ready</button></div>`;
  $('#start').onclick=startTurn;
}

let tick;
function startTurn(){
  screen(false);
  const p=S.order[S.turn];
  const end=Date.now()+30000;
  let sel=null;
  const used=new Set();
  const cost=()=>CLUES.filter(c=>used.has(c.k)).reduce((t,c)=>t+(c.cost||1),0);
  const co=clueOf(),pi=co?co[0]:threes()[0][0],cp=D.players[pi];
  const nat=cp[3],pos=cp[4],ini=cp[0].split(/\s+/).map(w=>w[0]).join('.')+'.';
  const CLUES=[
    {k:'order',img:'https://burst.shopifycdn.com/photos/pouring-pint-of-beer.jpg?width=240&format=pjpg&exif=0&iptc=0',name:'Club order',ok:!!co,val:()=>'Shown 1–2–3'},
    {k:'nat',img:'https://burst.shopifycdn.com/photos/freshly-poured-pint-of-beer.jpg?width=240&format=pjpg&exif=0&iptc=0',name:'Nationality',ok:!!nat,val:()=>esc(nat)},
    {k:'pos',img:'https://burst.shopifycdn.com/photos/poured-beer-pints.jpg?width=240&format=pjpg&exif=0&iptc=0',name:'Position',ok:!!pos,val:()=>esc(pos)},
    {k:'ini',img:'https://burst.shopifycdn.com/photos/wit-beer-in-glass.jpg?width=240&format=pjpg&exif=0&iptc=0',pos:'70% 60%',name:'Initials',ok:true,cost:2,val:()=>esc(ini)},
  ];
  document.body.classList.add('playing');
  app.innerHTML=`<div class="play" id="play"><div id="clubwrap">${clubsHTML()}</div>
  <div class="turnbar" id="tb"><div class="who">${esc(S.names[p])}</div><div class="secs" id="secs">30</div><button class="passbtn" id="pass">Pass</button></div>
  <div class="thin" id="thin"><i id="barfill" style="width:100%"></i></div>
  <div class="chips">${CLUES.map(c=>`<button class="chip" data-k="${c.k}" ${c.ok?'':'disabled'} aria-label="${c.name} clue, costs ${c.cost||1} point${(c.cost||1)>1?'s':''}"><div class="pint" style="background-image:url('${c.img}');background-position:${c.pos||'center'}"></div><b class="cost">${c.ok?`−${c.cost||1}`:'n/a'}</b><span>${c.name}</span></button>`).join('')}</div>
  <input type="text" id="guess" placeholder="Type a player, tap to lock in" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
  <div class="err" id="gerr" style="min-height:0;margin-top:4px"></div>
  <div class="sugg compact" id="sugg"></div>
  <div class="foot2">Round ${S.round} of ${S.rounds} · ${S.diff==='fun'?'Fun pub':'Hard mixed'}${S.modern?' · 2010+':''}</div></div>`;
  const g=$('#guess'),sg=$('#sugg');fitPlay();g.focus({preventScroll:true});
  const card=i=>`<b>${esc(D.players[i][0])}</b><span>${esc(D.players[i][2]||'Former player')}</span>`;
  const draw=()=>{
    const q=norm(g.value);$('#gerr').textContent='';
    if(q.length<2){sg.innerHTML='';return}
    const res=search(q,5);
    sg.innerHTML=res.length?res.map(i=>`<button data-i="${i}">${card(i)}</button>`).join(''):`<div class="none">No player found</div>`;
    sg.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>submit(+b.dataset.i));
  };
  g.oninput=draw;
  g.onkeydown=e=>{if(e.key==='Enter'){const f=sg.querySelector('[data-i]');if(f)f.click();else $('#gerr').textContent='Type a player and tap their name'}};
  const update=()=>{const left=Math.max(0,end-Date.now());const s=Math.ceil(left/1000);$('#secs').textContent=s;$('#barfill').style.width=(left/300)+'%';$('#thin').classList.toggle('low',s<=10);$('#tb').classList.toggle('low',s<=10);if(left<=0){clearInterval(tick);resolve(null,'Time’s up',null,cost())}};
  clearInterval(tick);tick=setInterval(update,250);
  $('#pass').onclick=()=>{clearInterval(tick);resolve(null,'Passed',null,cost())};
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;if(used.has(k))return;
    used.add(k);b.classList.add('poured');
    const c=CLUES.find(x=>x.k===k);
    b.querySelector('span').innerHTML=c.val();
    if(k==='order')$('#clubwrap').innerHTML=clubsHTML(null,co[1]);
    g.focus({preventScroll:true});
  });
  function submit(sel){
    if(S.answers.some(a=>a.player===sel)){$('#gerr').textContent=`${D.players[sel][0]} has already been said this round`;return}
    clearInterval(tick);
    const s=D.players[sel][1].filter(c=>S.trio.slice(0,3).includes(c)).length;
    resolve(D.players[sel][0],null,{i:sel,s},cost());
  }
}

function search(q,max=8){
  const qt=q.split(' '),out=[];
  for(let i=0;i<IDX.length&&out.length<max;i++){
    const t=IDX[i].t;
    if(qt.every(w=>t.some(x=>x.startsWith(w))))out.push(i);
  }
  return out;
}

function resolve(raw,reason,m,clues){
  const p=S.order[S.turn];
  let base=0,hits=[],player=null;
  if(m){player=m.i;base=m.s;hits=D.players[m.i][1].filter(c=>S.trio.slice(0,3).includes(c))}
  const ans={who:p,raw,player,base,clues,pts:base-clues,reason};
  S.answers.push(ans);S.scores[p]+=ans.pts;
  screen(false);
  const showResult=()=>{
    app.innerHTML=`${topbar()}${clubsHTML(raw?hits:[])}
    <div class="result ${!raw||ans.base===0?'shake':''}">
      ${!raw?`<div class="redcard"></div><div class="stamp miss">${reason==='Passed'?'Passed':'Whistle!'}</div>`:
        ans.base===3?`<div class="stamp goal">Goal!</div>`:
        ans.base===2?`<div class="stamp post">On target</div>`:
        ans.base===1?`<div class="stamp post">Off the post</div>`:
        `<div class="redcard"></div><div class="stamp miss">Miss</div>`}
      <div class="pts pop">${ans.pts}</div>
      ${clues?`<div class="calc">${plural(ans.base,'point')} − ${clues} for clues</div>`:''}
      <div class="matched">${reason?esc(reason):esc(D.players[player][0])}</div>
      <div class="dim">${esc(S.names[p])}</div>
    </div>
    ${raw?`<div class="label">Data missed a spell? Set the clubs matched</div><div class="override">${[0,1,2,3].map(n=>`<button data-p="${n}" class="${n===ans.base?'on':''}">${n}</button>`).join('')}</div>`:''}
    <div class="dock"><button class="btn" id="next">${S.turn+1<S.order.length?`Next: ${esc(S.names[S.order[S.turn+1]])}`:'See the round'}</button></div>`;
    app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const n=+b.dataset.p;const np=n-ans.clues;S.scores[p]+=np-ans.pts;ans.base=n;ans.pts=np;showResult()});
    $('#next').onclick=()=>{S.turn++;S.turn<S.order.length?turnIntro():roundEnd()};
  };
  showResult();
}

function standings(){
  const rows=S.names.map((n,i)=>({n,s:S.scores[i]})).sort((a,b)=>b.s-a.s);
  return `<div class="board">${rows.map((r,k)=>`<div class="${k===0&&r.s>0?'lead':''}"><span>${esc(r.n)}</span><b>${r.s}</b></div>`).join('')}</div>`;
}

function roundEnd(){
  screen(false);
  const t=S.trio,tr=t.slice(0,3),[three,total]=threes();
  const two=[];
  for(let i=0;i<D.players.length&&two.length<12;i++){const c=D.players[i][1];if(S.modern&&!D.players[i][5])continue;let n=0;for(const x of tr)if(c.includes(x))n++;if(n===2)two.push(i)}
  const pairs=i=>tr.filter(c=>D.players[i][1].includes(c)).map(c=>D.clubs[c][0]).join(' + ');
  app.innerHTML=`${topbar()}${clubsHTML()}
  <div class="label">This round</div>
  <div class="panel ans">${S.answers.map(a=>`<div><b>${esc(S.names[a.who])}</b> · ${a.player!=null?esc(D.players[a.player][0]):esc(a.reason)} · ${plural(a.pts,'pt')}${a.clues?` <span class="dim">(−${a.clues} clues)</span>`:''}</div>`).join('')}</div>
  <div class="label">Three points${S.modern?' · 2010+':''}</div>
  <div class="panel ans">${three.map(i=>esc(D.players[i][0])).join(', ')}${total>three.length?` <span class="dim">and ${total-three.length} more</span>`:''}</div>
  <div class="label">Two points</div>
  <div class="panel ans">${two.map(i=>`<div>${esc(D.players[i][0])} <span class="dim">· ${esc(pairs(i))}</span></div>`).join('')||'None'}</div>
  <div class="dock two"><button class="btn ghost" id="tbl">See table</button><button class="btn" id="next">${S.round<S.rounds?'Next round':'Final whistle'}</button></div>`;
  $('#tbl').onclick=tableScreen;
  $('#next').onclick=nextRound;
}

function tableScreen(){
  screen(false);
  app.innerHTML=`${topbar()}<div class="center" style="padding:10px 0 4px"><div class="kicker" style="color:var(--paper)">After round ${S.round}</div><h2 style="margin-top:4px">The table</h2></div>
  <div class="label">Standings</div>${standings()}
  <div class="dock two"><button class="btn ghost" id="back">Round recap</button><button class="btn" id="next">${S.round<S.rounds?'Next round':'Final whistle'}</button></div>`;
  $('#back').onclick=roundEnd;
  $('#next').onclick=nextRound;
}

function finish(){
  screen(false);
  const max=Math.max(...S.scores),winners=S.names.filter((_,i)=>S.scores[i]===max);
  app.innerHTML=`<div class="center" style="padding-top:22px"><div class="stamp goal" style="font-size:24px">Full time</div><h2 style="margin-top:6px">${winners.length>1?'It’s a draw':esc(winners[0])+' wins'}</h2><p class="lede">${winners.length>1?'Next round’s on everyone.':'Next round’s on the losers.'}</p></div>
  ${rail()}
  <div class="label">Final table</div>${standings()}
  <div class="dock two"><button class="btn ghost" id="new">New game</button><button class="btn" id="again">Rematch</button></div>`;
  $('#again').onclick=()=>{S.scores=S.names.map(()=>0);S.round=0;nextRound()};
  $('#new').onclick=setup;
}

init().catch(()=>{app.innerHTML='<p class="lede">Couldn’t load the player data. Refresh to try again.</p>'});
</script>
</body>
</html>
